name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The suite is hermetic: it never reaches Yahoo Finance, so CI stays
      # green regardless of upstream availability or rate limits.
      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      # `npm run build` runs `tsc -b` first, so this covers typechecking too.
      # It also proves the committed snapshot.json is valid, since the Vite
      # plugin reads it at build time.
      - name: Build
        working-directory: frontend
        run: npm run build
