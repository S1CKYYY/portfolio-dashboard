name: Update & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - '*.xlsx'
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
  schedule:
    - cron: '0 8 * * 1-5'   # Evropský open — 9:00 CET
    - cron: '30 15 * * 1-5' # US open — 9:30 ET / 15:30 UTC
    - cron: '0 22 * * 1-5'  # US close — 16:00 ET / 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r backend/requirements.txt pandas openpyxl

      - name: Process XTB XLSX exports
        run: |
          FILES=$(find . -maxdepth 1 -name "*.xlsx" 2>/dev/null | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            echo "Zpracovávám: $FILES"
            python tools/xtb_to_holdings.py $FILES \
              --currency EUR \
              --out backend/holdings.json
          else
            echo "Žádné XLSX soubory, používám stávající holdings.json"
          fi

      - name: Generate snapshot
        working-directory: backend
        run: |
          rm -rf ~/.cache/py-yfinance /tmp/yf-cache /tmp/yf-tz-fresh
          python generate_snapshot.py --no-cache

      - name: Patch true portfolio history
        run: |
          FILES=$(find . -maxdepth 1 -name "*.xlsx" 2>/dev/null | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            python tools/patch_true_history.py $FILES --snapshot snapshot.json
          else
            echo "Žádné XLSX soubory, přeskakuji"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Copy snapshot to frontend
        run: |
          mkdir -p frontend/public
          cp snapshot.json frontend/public/snapshot.json
          # Generuj macro.json
          python tools/generate_macro.py && cp macro.json frontend/public/macro.json || echo "⚠️ macro.json selhal, přeskakuji"

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --base=/portfolio-dashboard/

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json backend/holdings.json macro.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push || true
          else
            echo "Beze změny"
          fi

      - uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
