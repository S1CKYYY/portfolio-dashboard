name: Generate Market Brief

on:
  schedule:
    # Morning brief: 6:00 UTC = 7:00 CET (pondělí–pátek)
    - cron: '0 6 * * 1-5'
    # Evening brief: 20:30 UTC = 21:30 CET (pondělí–pátek)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'MORNING nebo EVENING (auto-detect pokud prázdné)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install anthropic

      - name: Generate brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SESSION="${{ github.event.inputs.session }}"
          if [ -n "$SESSION" ]; then
            echo "Generuji $SESSION brief (manuální spuštění)"
            python tools/generate_brief.py --session "$SESSION"
          else
            echo "Generuji brief (auto-detect session)"
            python tools/generate_brief.py
          fi

      - name: Commit brief JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brief_morning.json brief_evening.json frontend/public/brief_morning.json frontend/public/brief_evening.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Žádná změna briefe"
          else
            git commit -m "brief: $(date -u '+%Y-%m-%d %H:%M UTC') auto-generated"
            git push
          fi

      - name: Trigger dashboard deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'main'
            });
            console.log('Dashboard CI triggered');
